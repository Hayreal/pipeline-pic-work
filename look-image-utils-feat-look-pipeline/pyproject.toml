[project]
name = "look-image-utils"
version = "0.1.0"
description = "Look 商品图生成管线 CLI（look-pipeline）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.73.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.40.0",
]

[project.scripts]
look-pipeline = "look_pipeline.cli:main"
look-pipeline-ui = "look_pipeline.run_streamlit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["look_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
pack = [
    "pyinstaller>=6.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
